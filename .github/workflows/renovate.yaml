---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - renovate.json5
      - .renovate/**.json5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.LAB_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.LAB_ASSISTANT_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: codex-/return-dispatch@2e404d40b641ba1deb44be941660bb34828e4f6d # v4.0.0
        id: return_dispatch
        with:
          token: ${{ steps.app-token.outputs.token }}
          owner: ${{ github.repository_owner }}
          repo: admin
          ref: main
          workflow: schedule-renovate.yaml
          workflow_inputs: >-
            { "autodiscoverFilter": "${{ github.event.repository.name }}" }

      - name: Await Renovate completion
        uses: Codex-/await-remote-run@3dbfaaf0bc13b34a0e521de425dfed17654f24d5 # v2.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          owner: ${{ github.repository_owner }}
          repo: admin
          run_id: ${{ steps.return_dispatch.outputs.run_id }}

      - name: Renovate output
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh run view --repo ${{ github.repository_owner }}/admin --log ${{ steps.return_dispatch.outputs.run_id }}