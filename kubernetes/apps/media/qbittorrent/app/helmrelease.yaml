---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 30m
  timeout: 2m
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
        initContainers:
          fspermissions:
            image:
              repository: docker.io/library/busybox
              tag: latest
            command: ['/bin/sh', '-c', 'chown -R 2000:2000 /config']
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: true
          vpn:
            image:
              repository: qmcgaw/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            envFrom:
              - secretRef:
                  name: gluetun-secret
            env:
              VPN_TYPE: wireguard
              FIREWALL_INPUT_PORTS: "8080"
            nameOverride: gluetun
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - NET_ADMIN
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3
            env:
              QBT_WEBUI_PORT: &port 8080
            nameOverride: qbittorrent
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext:
              runAsGroup: 2000
              runAsUser: 2000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
    persistence:
      config:
        size: 1Gi
        accessMode: ReadWriteOnce
        advancedMounts:
          qbittorrent:
            fspermissions:
              - path: /config
            app:
              - path: /config
      downloads:
        type: nfs
        path: /data/media
        server: iota.internal
        advancedMounts:
          qbittorrent:
            app: 
              - path: /data/media/Downloads/qbittorrent
                subPath: Downloads/qbittorrent
      tmp:
        type: emptyDir
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        advancedMounts: 
          qbittorrent:
            vpn:
              - path: /dev/net/tun
    route:
      app:
        hostnames:
          - qbittorrent.mrtb.io
        parentRefs:
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *port
        primary: true