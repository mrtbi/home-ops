# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-mimo-v2-5-pro
spec:
  modelName: opencode-go/mimo-v2.5-pro
  params:
    model: openai/mimo-v2.5-pro
    apiBase: https://opencode.ai/zen/go/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENCODE_GO_API_KEY
    dropParams: true
  info:
    maxInputTokens: 1048576
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      supports_vision: false
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
      cache_read_input_token_cost: 0.000000003625
