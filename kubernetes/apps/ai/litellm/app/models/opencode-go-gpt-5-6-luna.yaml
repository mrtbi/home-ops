# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-gpt-5-6-luna
spec:
  modelName: opencode-go/gpt-5.6-luna
  params:
    model: openai/gpt-5.6-luna
    apiBase: https://opencode.ai/zen/go/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENCODE_GO_API_KEY
    dropParams: true
  info:
    maxInputTokens: 1050000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      supports_vision: true
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000002
      cache_creation_input_token_cost: 0.00000025