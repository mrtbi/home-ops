---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    agent:
      loopfileBaseDirs:
        - /var/mnt/PERSISTENT/miroir
      resources:
        limits:
          memory: 192Mi
    autoTieBreaker: false
    monitoring:
      dashboards:
        enabled: false
        grafanaOperator:
          enabled: false
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: false
      prometheusRule:
        enabled: false