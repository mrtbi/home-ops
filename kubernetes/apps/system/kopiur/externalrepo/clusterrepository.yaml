---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur-k8s-local
      prefix: clusters/main/
      region: us-east-1
      endpoint: fsn1.your-objectstorage.com
      auth:
        secretRef:
          name: kopiur-s3-secret
  create:
    enabled: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-s3-secret
      namespace: system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName